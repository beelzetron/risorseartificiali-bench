<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <title>Skateboarder doing airs and a 360 board spin on a half-pipe</title>
  <desc>Physics-based seamless loop: pendulum swings through the transitions (fastest at the flat bottom, slower near the lips), true parabolic projectile airs above the coping, a 360 board spin that realigns before touchdown. SMIL only, 5.88s loop.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3f2"/>
      <stop offset="0.72" stop-color="#e9f4f7"/>
      <stop offset="1" stop-color="#fdeecd"/>
    </linearGradient>
    <linearGradient id="rampFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d5f76"/>
      <stop offset="1" stop-color="#31404f"/>
    </linearGradient>
  </defs>

  <!-- ======================= BACKGROUND ======================= -->
  <rect width="900" height="520" fill="url(#sky)"/>

  <!-- Sun with soft glow -->
  <circle cx="450" cy="86" r="62" fill="#ffce54" opacity="0.35"/>
  <circle cx="450" cy="86" r="40" fill="#ffd882"/>

  <!-- Clouds: very slow seamless drift loops -->
  <g fill="#ffffff" opacity="0.9">
    <g>
      <ellipse cx="210" cy="88" rx="46" ry="15"/>
      <ellipse cx="182" cy="94" rx="28" ry="12"/>
      <ellipse cx="240" cy="94" rx="30" ry="11"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 28 0; 0 0" dur="47s" repeatCount="indefinite"/>
    </g>
    <g opacity="0.75">
      <ellipse cx="640" cy="62" rx="38" ry="12"/>
      <ellipse cx="616" cy="68" rx="22" ry="9"/>
      <ellipse cx="664" cy="68" rx="24" ry="9"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -22 0; 0 0" dur="61s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ======================= HALF-PIPE ======================= -->
  <!-- Solid ramp cross-section: flat bottom (y=440) + two 170px quarter-pipe transitions whose lips curl 2 deg past vertical (oververt), with deck platforms -->
  <path d="M36 264.1 L110.1 264.1 A170 170 0 0 0 280 440 L620 440 A170 170 0 0 0 789.9 264.1 L864 264.1 L864 520 L36 520 Z" fill="url(#rampFill)"/>
  <!-- Subtle structure: seams under the flat and deck support posts -->
  <path d="M280 442 V520 M620 442 V520" stroke="#263340" stroke-width="2.5" opacity="0.6" fill="none"/>
  <rect x="58" y="266" width="9" height="254" fill="#263340" opacity="0.5"/>
  <rect x="833" y="266" width="9" height="254" fill="#263340" opacity="0.5"/>
  <!-- Riding surface highlight (the rolling surface of both transitions and the flat) -->
  <path d="M36 264.1 H110.1 A170 170 0 0 0 280 440 H620 A170 170 0 0 0 789.9 264.1 H864" fill="none" stroke="#c7d3dc" stroke-width="5" stroke-linecap="round"/>
  <!-- Coping (metal tube) at each lip -->
  <circle cx="110.1" cy="264.1" r="6" fill="#e8eef2" stroke="#93a1ad" stroke-width="2"/>
  <circle cx="789.9" cy="264.1" r="6" fill="#e8eef2" stroke="#93a1ad" stroke-width="2"/>

  <!-- ======================= SKATER ======================= -->
  <!-- Motion path = ramp surface offset 10px (wheel contact) plus TWO TRUE PARABOLAS:
       each flight is a quadratic Bezier whose control point is A + v0*T/2, which reproduces an exact
       gravity projectile (vertical axis, tangent-matched takeoff and landing on the transition).
       keyPoints/keyTimes encode energy: accelerating out of the drop-in, fastest across the flat,
       decelerating up each transition (slower at the top), near-stall at the apex of each air,
       re-acceleration on descent. Path ends exactly where it starts => seamless loop. -->
  <g id="skater">
    <animateMotion dur="5.88s" repeatCount="indefinite" calcMode="linear"
      path="M 120.1 264.4 Q 131.7 -68.9 143.3 353.6 A 160 160 0 0 0 280 430 L 620 430 A 160 160 0 0 0 779.9 264.4 Q 768.3 -68.9 756.7 353.6 A 160 160 0 0 1 620 430 L 280 430 A 160 160 0 0 1 120.1 264.4"
      keyTimes="0;0.034;0.068;0.102;0.1211;0.1531;0.1871;0.2211;0.2745;0.3229;0.419;0.4564;0.5003;0.5343;0.5683;0.6023;0.6214;0.6533;0.6873;0.7214;0.7748;0.8232;0.9192;0.9566;1"
      keyPoints="0;0.031;0.052;0.0628;0.0646;0.0693;0.084;0.1086;0.1681;0.2395;0.388;0.4441;0.5;0.531;0.552;0.5628;0.5646;0.5693;0.584;0.6086;0.6681;0.7395;0.888;0.9441;1"/>

    <!-- Pose: board stays tangent to the ramp surface (vertical on the walls, flat on the bottom),
         with a small lay-back wobble at each apex; quick re-alignment snap after each landing impact -->
    <g id="pose">
      <animateTransform attributeName="transform" type="rotate" dur="5.88s" repeatCount="indefinite" calcMode="linear"
        values="92;86;92;58.5;0;0;-46;-92;-86;-92;-58.5;0;0;46;92"
        keyTimes="0;0.1211;0.2745;0.292;0.3229;0.419;0.4564;0.5003;0.6214;0.7748;0.792;0.8232;0.9192;0.9566;1"/>

      <!-- Skateboard: deck + 2 trucks + 4 wheels. It performs one full 360 spin during the
             right-side air (peaking at the apex) and is realigned ~0.3s before touchdown. -->
      <g id="board">
        <animateTransform attributeName="transform" type="rotate" dur="5.88s" repeatCount="indefinite"
          values="0;0;360;360" keyTimes="0;0.5748;0.7279;1"
          calcMode="spline" keySplines="0 0 1 1;0.3 0 0.7 1;0 0 1 1"/>
        <path d="M-19 -4 L-19 5.5 M19 -4 L19 5.5" stroke="#95a5a6" stroke-width="3"/>
        <circle cx="-24" cy="4.5" r="4.5" fill="#e2c25d" stroke="#bfa24a"/>
        <circle cx="24" cy="4.5" r="4.5" fill="#e2c25d" stroke="#bfa24a"/>
        <circle cx="-14" cy="5.5" r="4.5" fill="#f5d76e" stroke="#bfa24a"/>
        <circle cx="14" cy="5.5" r="4.5" fill="#f5d76e" stroke="#bfa24a"/>
        <path d="M-37 -10 Q-30 -10 -26 -5 L26 -5 Q30 -10 37 -10" fill="none" stroke="#148f77" stroke-width="4.5" stroke-linecap="round"/>
      </g>

      <!-- Body: squash-and-stretch synced to the physics — extended float at the apexes,
             compression on landing impact and at the bottom of each transition (pump) -->
      <g id="body">
        <animateTransform attributeName="transform" type="scale" dur="5.88s" repeatCount="indefinite" calcMode="linear"
          values="1;1.03;1;0.96;0.92;1;1.02;0.96;1;0.96;0.92;1;1"
          keyTimes="0;0.1211;0.2745;0.292;0.3229;0.419;0.5003;0.6214;0.7748;0.792;0.8232;0.9192;1"/>
        <path d="M-5 -56 L-14 -45 L-11 -33" stroke="#b23b31" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M-2 -35 L-11 -22 L-14 -6" stroke="#2f3640" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M-1 -35 L15 -21 L13 -6" stroke="#2f3640" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M-18 -6 L-10 -6 M9 -6 L17 -6" stroke="#2f3640" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M-1 -35 L-5 -57" stroke="#d64541" stroke-width="7.5" stroke-linecap="round"/>
        <circle cx="-7" cy="-66.5" r="7" fill="#f0c39b"/>
        <path d="M-14.3 -66.5 A7.3 7.3 0 0 1 0.3 -66.5 Z" fill="#2f3640"/>
        <path d="M0 -67.8 L5.2 -66.8" stroke="#2f3640" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Near arm: swings up for balance during the trick air -->
        <g transform="translate(-5 -56)">
          <path d="M0 0 L8 9 L15 19" stroke="#d64541" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <animateTransform attributeName="transform" type="rotate" additive="sum" dur="5.88s" repeatCount="indefinite"
            values="0;0;-85;-85;0;0" keyTimes="0;0.52;0.5748;0.7279;0.8;1"/>
        </g>
      </g>
    </g>
  </g>
</svg>
